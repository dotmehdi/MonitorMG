# Release : construit l'installateur et l'édition portable sur un runner Windows, fait
# signer les exécutables par SignPath quand le dépôt est configuré (voir docs/SIGNATURE.md),
# puis attache le tout, avec SHA256SUMS.txt, à une release GitHub créée en brouillon, ses
# notes tirées de CHANGELOG.md.
# Déclenchement : un tag vX.Y.Z, ou à la main depuis l'onglet Actions (workflow_dispatch) :
# un build de test, ou, case « release » cochée sur main, le tag de la version et sa release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Poser le tag vX.Y.Z de la version et créer sa release en brouillon (depuis main)"
        type: boolean
        default: false

permissions:
  contents: write # créer la release en brouillon
  actions: read # SignPath lit l'artefact à signer

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Vérifier que le tag correspond à la version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "le tag ${{ github.ref_name }} ne correspond pas à la version $v de tauri.conf.json" }

      # Lancé à la main : le tag n'existe pas encore, il sera posé après la construction.
      - name: Vérifier la demande de release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") { throw "une release se crée depuis main, pas depuis ${{ github.ref_name }}" }
          $v = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          git ls-remote --exit-code --tags origin "refs/tags/v$v" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "le tag v$v existe déjà : changez la version dans tauri.conf.json et Cargo.toml" }
          exit 0

      - name: Construire (non signé)
        run: node scripts/release.mjs --build

      # --- Signature via SignPath, seulement si le dépôt est configuré (docs/SIGNATURE.md). ---
      - name: Rassembler les exécutables à signer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $v = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory to-sign | Out-Null
          Copy-Item "dist/MonitorMG-$v-setup.exe" to-sign/setup.exe
          Copy-Item dist/portable/MonitorMG.exe to-sign/MonitorMG.exe

      - name: Téléverser l'artefact à signer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a-signer
          path: to-sign/

      - name: Faire signer par SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # L'approbation de la demande est manuelle dans le tableau de bord SignPath.
          wait-for-completion-timeout-in-seconds: "3600"
          output-artifact-directory: signed

      - name: Remettre les exécutables signés en place
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $v = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          Copy-Item signed/setup.exe "dist/MonitorMG-$v-setup.exe" -Force
          Copy-Item signed/MonitorMG.exe dist/portable/MonitorMG.exe -Force
      # --- Fin de la signature. ---

      - name: Empaqueter (zip portable et SHA256SUMS.txt)
        run: node scripts/release.mjs --pack

      - name: Déposer dist en artefact du workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      # Posé avec le jeton du workflow : ce tag ne relance pas le workflow.
      - name: Poser le tag de la version
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: pwsh
        run: |
          $v = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          git tag "v$v" "$env:GITHUB_SHA"
          git push origin "v$v"

      - name: Créer la release en brouillon
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          # Notes : CHANGELOG.md depuis cette version jusqu'à la dernière publiée, versions
          # restées sans release comprises.
          $log = (Get-Content CHANGELOG.md -Raw -Encoding utf8) -replace "`r`n", "`n"
          $prev = gh release view --json tagName --jq .tagName 2>$null
          $prev = if ($LASTEXITCODE -eq 0 -and $prev) { "$prev".TrimStart('v') } else { "" }
          $notes = ""
          $m = [regex]::Match($log, "(?m)^## $([regex]::Escape($v))[ \t]*$")
          if ($m.Success) {
            $body = $log.Substring($m.Index + $m.Length)
            $end = if ($prev) { [regex]::Match($body, "(?m)^## $([regex]::Escape($prev))[ \t]*$") } else { [regex]::Match($body, "(?m)^## ") }
            if (-not $end.Success) { $end = [regex]::Match($body, "(?m)^## ") }
            if ($end.Success) { $body = $body.Substring(0, $end.Index) }
            $notes = $body.Trim()
          }
          if (-not $notes) { $notes = "Voir [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." }
          if ("${{ vars.SIGNPATH_ORGANIZATION_ID }}" -ne "") {
            # Mention exigée par les conditions de SignPath Foundation.
            $notes += "`n`nFree code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
          }
          # Par un fichier : passées en argument, les guillemets des notes seraient abîmés.
          $file = Join-Path $env:RUNNER_TEMP "notes.md"
          [IO.File]::WriteAllText($file, $notes)
          gh release create "v$v" --verify-tag --draft --title "MonitorMG $v" --notes-file $file (Get-ChildItem dist -File | ForEach-Object FullName)
