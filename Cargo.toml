[package]
name = "monitormg"
version = "2.3.1"
edition = "2021"
license = "MIT"
description = "Gestion des écrans pour Windows : disposition, résolution, fréquence, profils"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Devices_Display",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Un verrou gardé dans un `match` ou trop longtemps a déjà pu figer l'application
# (attente croisée avec le thread principal) : ces lints le signalent.
[lints.clippy]
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"
